name: Build KetoScan APK

on:
  push:
    branches:
      - ketoscan-build-v0.2
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct KetoScan source archive
        shell: bash
        run: |
          cat ketoscan-build/KetoScan-v0.2.part*.b64 | base64 -d > KetoScan-v0.2.zip
          unzip -q KetoScan-v0.2.zip
          test -f KetoScan-v0.2/settings.gradle.kts

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('KetoScan-v0.2/app/build.gradle.kts')
          s = p.read_text()
          marker = '    buildFeatures {\n        compose = true\n    }'
          replacement = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          buildFeatures {
              compose = true
          }'''
          if marker not in s:
              raise SystemExit('Could not locate buildFeatures block for JVM patch')
          p.write_text(s.replace(marker, replacement, 1))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: KetoScan-v0.2
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect installable APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp KetoScan-v0.2/app/build/outputs/apk/debug/app-debug.apk apk-output/KetoScan-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KetoScan-v0.2-APK
          path: apk-output/KetoScan-v0.2-debug.apk
          if-no-files-found: error
          retention-days: 7

name: Temporary KetoScan APK Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    if: startsWith(github.head_ref, 'ketoscan-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Reconstruct KetoScan source archive
        shell: bash
        run: |
          cat ketoscan-build/KetoScan-v0.2.part*.b64 | base64 -d > KetoScan-v0.2.zip
          unzip -q KetoScan-v0.2.zip
          test -f KetoScan-v0.2/settings.gradle.kts

      - name: Patch Android build and scanner source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('KetoScan-v0.2/app/build.gradle.kts')
          s = gradle.read_text()
          marker = '    buildFeatures {\n        compose = true\n    }'
          replacement = '''    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }

          buildFeatures {
              compose = true
          }'''
          if marker in s:
              s = s.replace(marker, replacement, 1)
          gradle.write_text(s)

          ui = Path('KetoScan-v0.2/app/src/main/java/com/ketoscan/app/ui/KetoScanApp.kt')
          s = ui.read_text()
          s = s.replace('com.google.android.gms.mlkit.vision.codescanner.', 'com.google.mlkit.vision.codescanner.')
          old = '''        photoUri = FileProvider.getUriForFile(
            context,
            "${context.packageName}.fileprovider",
            file
        )
        takePicture.launch(photoUri)'''
          new = '''        val uri = FileProvider.getUriForFile(
            context,
            "${context.packageName}.fileprovider",
            file
        )
        photoUri = uri
        takePicture.launch(uri)'''
          if old in s:
              s = s.replace(old, new, 1)
          ui.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: KetoScan-v0.2
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect installable APK
        shell: bash
        run: |
          mkdir -p apk-output
          cp KetoScan-v0.2/app/build/outputs/apk/debug/app-debug.apk apk-output/KetoScan-v0.2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KetoScan-v0.2-APK
          path: apk-output/KetoScan-v0.2-debug.apk
          if-no-files-found: error
          retention-days: 7
